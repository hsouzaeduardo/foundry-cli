[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foundry-cli"
version = "0.1.0"
description = "Launch Claude Code, Codex, GitHub Copilot CLI, OpenCode and Pi against a Microsoft Foundry endpoint."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "questionary>=2.0.0",
  "rich>=13.0.0",
  # Codex is configured through TOML; tomlkit round-trips it without reformatting
  # a file the user may also edit by hand.
  "tomlkit>=0.13.0",
  "typer>=0.12.0",
]

[project.scripts]
foundry = "foundry.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/foundry"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]
